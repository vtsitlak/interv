<div class="min-h-screen flex items-center justify-center bg-base-200 px-4">
  <div class="card w-full max-w-sm bg-base-100 shadow-xl">
    <div class="card-body">
      <a routerLink="/" class="link link-hover text-sm mb-2">← Back to home</a>
      <h2 class="card-title text-2xl font-bold mb-1">Recruiter registration</h2>
      <p class="text-sm text-base-content/60 mb-4">
        Create your account, then complete your recruiter profile.
      </p>

      @if (facade.error()) {
        <div class="alert alert-error text-sm">{{ facade.error() }}</div>
      }

      <form (ngSubmit)="onRegister()">
        <fieldset class="fieldset">
          <label class="fieldset-label" for="recruiter-reg-name">Full name</label>
          <input
            id="recruiter-reg-name"
            type="text"
            [formField]="registerForm.name"
            autocomplete="name"
            class="input input-bordered w-full"
            placeholder="Jane Smith"
          />
        </fieldset>

        <fieldset class="fieldset mt-2">
          <label class="fieldset-label" for="recruiter-reg-email">Email</label>
          <input
            id="recruiter-reg-email"
            type="email"
            [formField]="registerForm.email"
            autocomplete="email"
            class="input input-bordered w-full"
            placeholder="you@company.com"
          />
        </fieldset>

        <fieldset class="fieldset mt-2">
          <label class="fieldset-label" for="recruiter-reg-password"
            >Password</label
          >
          <input
            id="recruiter-reg-password"
            type="password"
            [formField]="registerForm.password"
            autocomplete="new-password"
            class="input input-bordered w-full"
            placeholder="••••••••"
          />
        </fieldset>

        <button
          type="submit"
          class="btn btn-secondary w-full mt-6"
          [disabled]="facade.loading() || registerForm().invalid()"
        >
          @if (facade.loading()) {
            <span class="loading loading-spinner loading-sm"></span>
          } @else {
            Create recruiter account
          }
        </button>
      </form>

      <p class="text-center text-sm mt-4">
        Already registered?
        <a routerLink="/recruiter/login" class="link link-secondary">Sign in</a>
      </p>
    </div>
  </div>
</div>
