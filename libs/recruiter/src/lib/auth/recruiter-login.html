<div class="min-h-screen flex items-center justify-center bg-base-200 px-4">
  <div class="card w-full max-w-sm bg-base-100 shadow-xl">
    <div class="card-body">
      <a routerLink="/" class="link link-hover text-sm mb-2">← Back to home</a>
      <h2 class="card-title text-2xl font-bold mb-1">Recruiter sign in</h2>
      <p class="text-sm text-base-content/60 mb-4">
        Access your dashboard and search candidates.
      </p>

      @if (facade.error()) {
        <div class="alert alert-error text-sm">{{ facade.error() }}</div>
      }

      <form (ngSubmit)="onLogin()">
        <fieldset class="fieldset">
          <label class="fieldset-label" for="recruiter-login-email">Email</label>
          <input
            id="recruiter-login-email"
            type="email"
            [formField]="loginForm.email"
            autocomplete="email"
            class="input input-bordered w-full"
            placeholder="you@company.com"
          />
        </fieldset>

        <fieldset class="fieldset mt-2">
          <label class="fieldset-label" for="recruiter-login-password"
            >Password</label
          >
          <input
            id="recruiter-login-password"
            type="password"
            [formField]="loginForm.password"
            autocomplete="current-password"
            class="input input-bordered w-full"
            placeholder="••••••••"
          />
        </fieldset>

        <button
          type="submit"
          class="btn btn-secondary w-full mt-6"
          [disabled]="facade.loading() || loginForm().invalid()"
        >
          @if (facade.loading()) {
            <span class="loading loading-spinner loading-sm"></span>
          } @else {
            Sign in
          }
        </button>
      </form>

      <p class="text-center text-sm mt-4">
        New recruiter?
        <a routerLink="/recruiter/register" class="link link-secondary"
          >Create account</a
        >
      </p>
    </div>
  </div>
</div>
