<div class="min-h-screen flex items-center justify-center bg-base-200 px-4">
  <div class="card w-full max-w-sm bg-base-100 shadow-xl">
    <div class="card-body">
      <div class="flex justify-center mb-2">
        <a routerLink="/" [attr.aria-label]="'Interv home'">
          <interv-logo size="md" />
        </a>
      </div>
      <a routerLink="/" class="link link-hover text-sm mb-2">← Back to home</a>
      <h2 class="card-title text-2xl font-bold mb-1">{{ copy().loginTitle }}</h2>
      <p class="text-sm text-base-content/60 mb-4">{{ copy().loginSubtitle }}</p>

      @if (facade.error()) {
        <div class="alert alert-error text-sm">{{ facade.error() }}</div>
      }

      <form (ngSubmit)="onLogin()">
        <fieldset class="fieldset">
          <label class="fieldset-label" for="login-email">Email</label>
          <input
            id="login-email"
            type="email"
            [formField]="loginForm.email"
            autocomplete="email"
            class="input input-bordered w-full"
            placeholder="you@example.com"
          />
        </fieldset>

        <fieldset class="fieldset mt-2">
          <label class="fieldset-label" for="login-password">Password</label>
          <input
            id="login-password"
            type="password"
            [formField]="loginForm.password"
            autocomplete="current-password"
            class="input input-bordered w-full"
            placeholder="••••••••"
          />
        </fieldset>

        <button
          type="submit"
          class="btn w-full mt-6"
          [class]="copy().btnClass"
          [disabled]="facade.loading() || loginForm().invalid()"
        >
          @if (facade.loading()) {
            <span class="loading loading-spinner loading-sm"></span>
          } @else {
            {{ copy().signInLabel }}
          }
        </button>
      </form>

      <div class="divider">or</div>

      <button
        type="button"
        class="btn btn-outline w-full"
        (click)="onGoogleSignIn()"
        [disabled]="facade.loading()"
      >
        <svg
          class="w-5 h-5 mr-2 shrink-0"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path fill="currentColor" [attr.d]="googleBrandPath" />
        </svg>
        Continue with Google
      </button>

      <p class="text-center text-sm mt-4">
        {{ copy().alternatePrompt }}
        <a [routerLink]="copy().registerPath" [class]="'link ' + copy().linkClass">{{
          copy().alternateLink
        }}</a>
      </p>
    </div>
  </div>
</div>
