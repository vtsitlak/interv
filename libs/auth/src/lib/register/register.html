<div class="min-h-screen flex items-center justify-center bg-base-200 px-4">
  <div class="card w-full max-w-sm bg-base-100 shadow-xl">
    <div class="card-body">
      <div class="flex justify-center mb-2">
        <a routerLink="/" [attr.aria-label]="'Interv home'">
          <interv-logo size="md" />
        </a>
      </div>
      <a routerLink="/" class="link link-hover text-sm mb-2">← Back to home</a>
      <h2 class="card-title text-2xl font-bold mb-1">{{ copy().registerTitle }}</h2>
      <p class="text-sm text-base-content/60 mb-4">{{ copy().registerSubtitle }}</p>

      @if (facade.error()) {
        <div class="alert alert-error text-sm">{{ facade.error() }}</div>
      }

      <form (ngSubmit)="onRegister()">
        <fieldset class="fieldset">
          <label class="fieldset-label" for="register-name">Full name</label>
          <input
            id="register-name"
            type="text"
            [formField]="registerForm.name"
            autocomplete="name"
            class="input input-bordered w-full"
            placeholder="Jane Smith"
          />
        </fieldset>

        <fieldset class="fieldset mt-2">
          <label class="fieldset-label" for="register-email">Email</label>
          <input
            id="register-email"
            type="email"
            [formField]="registerForm.email"
            autocomplete="email"
            class="input input-bordered w-full"
            placeholder="you@example.com"
          />
        </fieldset>

        <fieldset class="fieldset mt-2">
          <label class="fieldset-label" for="register-password">Password</label>
          <input
            id="register-password"
            type="password"
            [formField]="registerForm.password"
            autocomplete="new-password"
            class="input input-bordered w-full"
            placeholder="••••••••"
          />
        </fieldset>

        <button
          type="submit"
          class="btn w-full mt-6"
          [class]="copy().btnClass"
          [disabled]="facade.loading() || registerForm().invalid()"
        >
          @if (facade.loading()) {
            <span class="loading loading-spinner loading-sm"></span>
          } @else {
            {{ copy().createAccountLabel }}
          }
        </button>
      </form>

      <div class="divider">or</div>

      <button
        type="button"
        class="btn btn-outline w-full"
        (click)="onGoogleSignUp()"
        [disabled]="facade.loading()"
      >
        <svg
          class="w-5 h-5 mr-2 shrink-0"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path fill="currentColor" [attr.d]="googleBrandPath" />
        </svg>
        Continue with Google
      </button>

      <p class="text-center text-sm mt-4">
        Already have an account?
        <a [routerLink]="copy().loginPath" [class]="'link ' + copy().linkClass"
          >Sign in</a
        >
      </p>
    </div>
  </div>
</div>
