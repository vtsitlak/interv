<header class="border-b border-base-300 bg-base-100 shadow-sm">
  <div class="navbar min-h-14 max-w-7xl mx-auto px-2 sm:px-4">
    <div class="navbar-start">
      <a
        [routerLink]="homeLink()"
        class="btn btn-ghost text-lg font-semibold tracking-tight normal-case"
      >
        {{ title() }}
      </a>
    </div>
    <div class="navbar-end flex-wrap gap-1 sm:gap-2">
      @if (isAuthenticated()) {
        <a
          routerLink="/dashboard"
          routerLinkActive="btn-active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="btn btn-ghost btn-sm"
        >
          Dashboard
        </a>
        <a
          routerLink="/profile"
          routerLinkActive="btn-active"
          class="btn btn-ghost btn-sm"
        >
          Train profile
        </a>
        <a
          routerLink="/my-profile"
          routerLinkActive="btn-active"
          class="btn btn-ghost btn-sm"
        >
          My profile
        </a>
        <a
          routerLink="/test-interview"
          routerLinkActive="btn-active"
          class="btn btn-ghost btn-sm"
        >
          Test interview
        </a>
        <button
          type="button"
          class="btn btn-outline btn-sm"
          (click)="onLogoutClick()"
        >
          Logout
        </button>
      } @else {
        <a
          routerLink="/login"
          routerLinkActive="btn-active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="btn btn-ghost btn-sm"
        >
          Login
        </a>
        <a
          routerLink="/register"
          routerLinkActive="btn-active"
          class="btn btn-ghost btn-sm"
        >
          Register
        </a>
      }
    </div>
  </div>
</header>
