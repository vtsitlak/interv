@if (isLoading()) {
  <div class="flex justify-center py-8">
    <span class="loading loading-spinner loading-md"></span>
  </div>
} @else if (messages().length === 0) {
  <p class="text-sm text-base-content/50 text-center py-4">
    No messages recorded for this interview.
  </p>
} @else {
  <div class="space-y-3 max-h-96 overflow-y-auto pr-1">
    @for (message of messages(); track $index) {
      <div
        class="rounded-xl p-3 text-sm"
        [class.bg-primary/10]="message.role === 'assistant'"
        [class.bg-base-200]="message.role === 'user'"
      >
        <div class="flex items-center justify-between gap-2 mb-1">
          <span class="font-medium text-xs">{{ roleLabel(message.role) }}</span>
          <span class="text-xs text-base-content/40">{{
            formatTime(message.timestamp)
          }}</span>
        </div>
        <p class="text-base-content/80 leading-relaxed whitespace-pre-wrap">
          {{ message.content }}
        </p>
      </div>
    }
  </div>
}
