<div class="min-h-screen flex flex-col bg-base-200">
  <interv-header
    [title]="title"
    [isAuthenticated]="authFacade.isAuthenticated()"
    [isRecruiter]="authFacade.isRecruiter()"
    (logoutRequested)="onLogout()"
    (resetProfileRequested)="openResetProfileConfirm()"
    (deleteAccountRequested)="openDeleteAccountConfirm()"
  />
  <div class="flex-1 flex flex-col min-h-0">
    <router-outlet />
  </div>
</div>

@if (accountConfirmAction()) {
  <interv-confirm-modal
    [open]="true"
    [title]="accountConfirmTitle()"
    [message]="accountConfirmMessage()"
    [confirmLabel]="accountConfirmLabel()"
    cancelLabel="Cancel"
    [isConfirming]="isAccountActionLoading()"
    confirmButtonClass="btn-error"
    (confirmed)="confirmAccountAction()"
    (cancelled)="cancelAccountConfirm()"
  />
}

@if (accountActionError(); as error) {
  <div class="fixed bottom-4 right-4 z-[110] max-w-sm">
    <div class="alert alert-error shadow-lg">
      <span>{{ error }}</span>
      <button
        type="button"
        class="btn btn-ghost btn-xs"
        (click)="accountActionError.set(null)"
      >
        Dismiss
      </button>
    </div>
  </div>
}
